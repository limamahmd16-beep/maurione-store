<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MauriOne Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;background:#f5f5f7;color:#111;padding-bottom:82px}button,input,select{font:inherit}.hide{display:none!important}.login{min-height:100vh;background:#fff;display:grid;place-items:center;padding:20px}.login>div{max-width:420px;width:100%;text-align:center;border:1px solid #e8e8eb;border-radius:24px;padding:28px}.login button,.primary{width:100%;border:0;border-radius:12px;padding:13px;background:#111;color:#fff}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e8e8eb;padding:12px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:18px}.brand span{color:#d3a44d}.top button{border:0;border-radius:10px;padding:9px 11px}.page{display:none}.page.on{display:block}.panel{margin:12px;background:#fff;border-radius:18px;padding:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px}.stat{background:#fff;border-radius:17px;padding:16px}.stat small{color:#888}.stat b{display:block;font-size:24px;margin-top:6px}.field{margin:10px 0}.field label{display:block;color:#888;font-size:11px;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #e5e5e8;border-radius:10px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #e8e8eb;padding:8px 2px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;font-size:10px;padding:8px 2px}.nav button.active{font-weight:900}.card{border:1px solid #e8e8eb;border-radius:16px;padding:13px;margin:10px 0;background:#fff;text-align:right;width:100%}.card.done{border-color:#cde9d7;background:#fbfffc}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:9px;padding:5px 8px;border-radius:20px;background:#eef5ff;color:#225d9b}.pill.done{background:#edf8f1;color:#168247}.prod{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;border-top:1px solid #eee;padding:9px 0}.prod img,.thumb{width:58px;height:58px;border-radius:10px;object-fit:contain;background:#f6f6f8}.muted{color:#888;font-size:10px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}.count{background:#f5f5f7;border-radius:20px;padding:5px 8px;font-size:9px;color:#777}.empty{background:#f6f6f8;color:#888;padding:16px;border-radius:12px;text-align:center}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:flex-end}.overlay.open{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 30px}.sheethead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;background:#fff;padding:8px 0 12px;border-bottom:1px solid #eee}.sheethead button{width:38px;height:38px;border:0;border-radius:50%}.detail{padding:14px 0;border-bottom:1px solid #eee}.detail .row{padding:5px 0}.proof{width:100%;max-height:380px;object-fit:contain;border-radius:12px}.ok{color:#168247;font-size:11px;margin-top:8px}.warn{background:#fff4d9;color:#8d5d00;padding:9px;border-radius:10px;margin:7px 0}.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
@media(max-width:390px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<div id="login" class="login"><div><h1>Mauri<span style="color:#d3a44d">One</span> Admin</h1><p>الدخول مخصص للمدير فقط.</p><button id="loginBtn">تسجيل الدخول باستخدام Google</button><div id="loginMsg" class="muted" style="margin-top:12px">جاري التحقق...</div></div></div>
<div id="app" class="hide"><div class="top"><div class="brand">Mauri<span>One</span> Admin</div><div><button onclick="location.href='/'">المتجر</button><button id="logoutBtn">خروج</button></div></div>
<section id="home" class="page on"><div class="stats"><div class="stat"><small>الطلبات الحالية</small><b id="nActive">0</b></div><div class="stat"><small>المبيعات المكتملة</small><b id="sales">0</b></div><div class="stat"><small>الطلبات المكتملة</small><b id="nDone">0</b></div><div class="stat"><small>المنتجات</small><b id="nProducts">0</b></div></div><div class="panel"><h2>تنبيهات المخزون</h2><div id="warnings"></div></div><div class="panel"><h2>أحدث الطلبات الحالية</h2><div id="latest"></div></div></section>
<section id="orders" class="page"><div class="panel"><div class="sectionTitle"><h2>الطلبات الحالية</h2><span id="activeCount" class="count">0</span></div><div id="activeList"></div><div class="sectionTitle" style="border-top:1px solid #eee;padding-top:20px;margin-top:28px"><h2>الطلبات المكتملة</h2><span id="doneCount" class="count">0</span></div><div id="doneList"></div></div></section>
<section id="products" class="page"><div class="panel"><h2>تسجيل منتج</h2><div class="grid"><div class="field full"><label>اسم المنتج</label><input id="pName"></div><div class="field"><label>القسم</label><select id="pCat"><option>الهواتف</option><option>الكمبيوتر</option><option>الإكسسوارات</option><option>الساعات</option><option>السماعات</option></select></div><div class="field"><label>المورد</label><select id="pSup"><option value="">بدون مورد</option></select></div><div class="field"><label>سعر الشراء</label><input id="pCost" type="number"></div><div class="field"><label>سعر البيع</label><input id="pPrice" type="number"></div><div class="field"><label>ربح القطعة</label><input id="pProfit" readonly></div><div class="field"><label>هامش الربح</label><input id="pMargin" readonly></div><div class="field"><label>المخزون</label><input id="pStock" type="number" value="1"></div><div class="field"><label>حد التحذير</label><input id="pMin" type="number" value="2"></div><div class="field full"><label>المواصفات</label><input id="pMeta"></div><div class="field full"><label>صور المنتج — حتى 6</label><input id="pImages" type="file" accept="image/*" multiple><div id="preview" class="imgs"></div><div id="uploadMsg" class="muted"></div></div></div><button id="saveProduct" class="primary">حفظ المنتج</button></div><div class="panel"><h2>المنتجات الحالية</h2><div id="productList"></div></div></section>
<section id="more" class="page"><div class="panel"><h2>المزيد</h2><div class="grid"><button class="card" onclick="openPage('suppliers','navMore')">الموردون</button><button class="card" onclick="openPage('customers','navMore')">الزبناء</button></div></div></section>
<section id="suppliers" class="page"><div class="panel"><h2>تسجيل مورد</h2><div class="field"><label>الاسم</label><input id="sName"></div><div class="field"><label>الهاتف</label><input id="sPhone"></div><div class="field"><label>WhatsApp</label><input id="sWhats"></div><div class="field"><label>العنوان</label><input id="sAddress"></div><div class="field"><label>المواد</label><input id="sMaterials"></div><button id="saveSupplier" class="primary">حفظ المورد</button></div><div class="panel"><div id="supplierList"></div></div></section>
<section id="customers" class="page"><div class="panel"><h2>تسجيل زبون</h2><div class="field"><label>الاسم</label><input id="cName"></div><div class="field"><label>الهاتف</label><input id="cPhone"></div><div class="field"><label>WhatsApp</label><input id="cWhats"></div><div class="field"><label>المدينة</label><input id="cCity"></div><div class="field"><label>العنوان</label><input id="cAddress"></div><button id="saveCustomer" class="primary">حفظ الزبون</button></div><div class="panel"><div id="customerList"></div></div></section>
<nav class="nav"><button id="navHome" class="active" onclick="openPage('home','navHome')">الرئيسية</button><button id="navOrders" onclick="openPage('orders','navOrders')">الطلبات</button><button id="navProducts" onclick="openPage('products','navProducts')">المنتجات</button><button id="navMore" onclick="openPage('more','navMore')">المزيد</button><button onclick="location.href='/'">المتجر</button></nav></div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeOrder()"><div class="sheet"><div class="sheethead"><h2>تفاصيل الطلب</h2><button onclick="closeOrder()">×</button></div><div id="detail"></div></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';import{getFirestore,collection,doc,addDoc,onSnapshot,serverTimestamp,writeBatch}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyBjbAU0Y9Kk5d5c_FvLWYBv9Td0l9TpoLA',authDomain:'maurione-store.firebaseapp.com',projectId:'maurione-store',storageBucket:'maurione-store.firebasestorage.app',messagingSenderId:'323665580616',appId:'1:323665580616:web:9114b435dafd0a3d6e7e7d'},ADMIN='limamahmd16@gmail.com',CLOUD='bjlglhaw',PRESET='maurione',fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));provider.setCustomParameters({prompt:'select_account'});
let pub=[],priv={},products=[],orders=[],suppliers=[],customers=[],started=false;
$('loginBtn').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/cancelled-popup-request')await signInWithRedirect(auth,provider);else $('loginMsg').textContent=e.message}};$('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{if(!u){$('login').classList.remove('hide');$('app').classList.add('hide');$('loginMsg').textContent='سجّل الدخول بحساب المدير.';return}if((u.email||'').toLowerCase()!==ADMIN){await signOut(auth);$('loginMsg').textContent='هذا الحساب غير مصرح.';return}$('login').classList.add('hide');$('app').classList.remove('hide');start()});
window.openPage=(id,nav)=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id)?.classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$(nav)?.classList.add('active');scrollTo(0,0)};
function start(){if(started)return;started=true;onSnapshot(collection(db,'products'),s=>{pub=s.docs.map(d=>({id:d.id,...d.data()}));merge()});onSnapshot(collection(db,'product_private'),s=>{priv={};s.docs.forEach(d=>priv[d.id]=d.data());merge()});onSnapshot(collection(db,'orders'),s=>{orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));render()});onSnapshot(collection(db,'suppliers'),s=>{suppliers=s.docs.map(d=>({id:d.id,...d.data()}));render()});onSnapshot(collection(db,'customers'),s=>{customers=s.docs.map(d=>({id:d.id,...d.data()}));render()})}function merge(){products=pub.map(p=>({...p,...(priv[p.id]||{})}));render()}
function status(s){return({new:'تم استلام الطلب',confirmed:'تم تأكيد الطلب',preparing:'جاري التجهيز',shipped:'خرج للتوصيل',delivered:'تم التسليم',cancelled:'ملغي'})[s]||s||'تم استلام الطلب'}function pay(p){return p==='cod'?'الدفع عند الاستلام':p==='transfer'?'تحويل بنكي':'—'}function pimg(i){if(i?.image)return i.image;const p=pub.find(x=>String(x.id)===String(i.productId));return p?.images?.[0]||''}
function card(o,small=false){const items=Array.isArray(o.items)?o.items:[],show=small?items.slice(0,1):items.slice(0,2),done=o.status==='delivered';return`<button class="card ${done?'done':''}" onclick="openOrder('${esc(o.id)}')"><div class="row"><b dir="ltr">${esc(o.orderNo||o.id)}</b><span class="pill ${done?'done':''}">${esc(status(o.status))}</span></div>${show.map(i=>{const im=pimg(i);return`<div class="prod">${im?`<img src="${esc(im)}">`:'<div class="thumb"></div>'}<div><b>${esc(i.name||'منتج')}</b><div class="muted">${Number(i.qty||1)} × ${Number(i.price||0).toLocaleString()} MRU</div></div></div>`}).join('')}<div class="row" style="border-top:1px solid #eee;padding-top:10px"><span class="muted">${items.reduce((s,x)=>s+Number(x.qty||1),0)} قطعة</span><b>${Number(o.total||0).toLocaleString()} MRU</b></div></button>`}
window.openOrder=id=>{const o=orders.find(x=>x.id===id);if(!o)return;const c=o.customer||{},items=o.items||[];$('detail').innerHTML=`<div class="detail"><div class="row"><span>رقم الطلب</span><b dir="ltr">${esc(o.orderNo||o.id)}</b></div><div class="row"><span>الحالة</span><b>${esc(status(o.status))}</b></div><div class="row"><span>طريقة الدفع</span><b>${esc(pay(o.payment))}</b></div><div class="row"><span>الإجمالي</span><b>${Number(o.total||0).toLocaleString()} MRU</b></div></div><div class="detail"><h3>إدارة التوصيل</h3><div class="field"><label>الحالة التي يراها الزبون</label><select id="st"><option value="new" ${o.status==='new'?'selected':''}>تم استلام الطلب</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>تم تأكيد الطلب</option><option value="preparing" ${o.status==='preparing'?'selected':''}>جاري التجهيز</option><option value="shipped" ${o.status==='shipped'?'selected':''}>خرج للتوصيل</option><option value="delivered" ${o.status==='delivered'?'selected':''}>تم التسليم</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>إلغاء الطلب</option></select></div><div class="field"><label>موعد التسليم المتوقع</label><input id="eta" type="date" value="${esc(o.estimatedDelivery||'')}"></div><button id="saveProgress" class="primary" onclick="saveProgress('${esc(o.id)}')">حفظ حالة التوصيل</button><div id="progressMsg"></div></div>${o.payment==='transfer'?`<div class="detail"><h3>إثبات التحويل</h3>${o.paymentProofUrl?`<a href="${esc(o.paymentProofUrl)}" target="_blank"><img class="proof" src="${esc(o.paymentProofUrl)}"></a>`:'لا يوجد إثبات'}</div>`:''}<div class="detail"><h3>المنتجات</h3>${items.map(i=>{const im=pimg(i);return`<div class="prod">${im?`<img src="${esc(im)}">`:'<div class="thumb"></div>'}<div><b>${esc(i.name||'منتج')}</b><div class="muted">الكمية: ${Number(i.qty||1)} — ${Number(i.price||0).toLocaleString()} MRU</div></div></div>`}).join('')}</div><div class="detail"><h3>بيانات العميل</h3><div class="row"><span>الاسم</span><b>${esc(c.name||'—')}</b></div><div class="row"><span>الهاتف</span><b>${esc(c.phone||'—')}</b></div><div class="row"><span>المدينة</span><b>${esc(c.city||'—')}</b></div><div class="row"><span>العنوان</span><b>${esc(c.address||'—')}</b></div>${c.phone?`<a class="primary" style="display:block;text-align:center;text-decoration:none;margin-top:12px" href="tel:${esc(c.phone)}">اتصال بالعميل</a>`:''}</div>`;$('overlay').classList.add('open')};
window.closeOrder=()=>$('overlay').classList.remove('open');
window.saveProgress=async id=>{const o=orders.find(x=>x.id===id);if(!o)return;const st=$('st').value,eta=$('eta').value||'',btn=$('saveProgress'),msg=$('progressMsg');btn.disabled=true;msg.textContent='جاري الحفظ...';try{const b=writeBatch(db);b.update(doc(db,'orders',id),{status:st,estimatedDelivery:eta,updatedAt:serverTimestamp()});b.set(doc(db,'orderTracking',id),{orderNo:o.orderNo||id,status:st,estimatedDelivery:eta,updatedAt:serverTimestamp()},{merge:true});await b.commit();o.status=st;o.estimatedDelivery=eta;render();if(st==='delivered'){msg.className='ok';msg.textContent='تم التسليم ونُقل الطلب إلى الطلبات المكتملة.';setTimeout(()=>{closeOrder();openPage('orders','navOrders')},300)}else{msg.className='ok';msg.textContent='تم الحفظ وسيظهر للزبون.'}}catch(e){msg.textContent='تعذر الحفظ: '+e.message}finally{btn.disabled=false}};
function render(){const active=orders.filter(o=>o.status!=='delivered'),done=orders.filter(o=>o.status==='delivered');$('nActive').textContent=active.length;$('nDone').textContent=done.length;$('nProducts').textContent=products.length;$('sales').textContent=done.reduce((s,o)=>s+Number(o.total||0),0).toLocaleString();$('latest').innerHTML=active.length?active.slice(0,3).map(o=>card(o,true)).join(''):'<div class="empty">لا توجد طلبات حالية.</div>';$('activeCount').textContent=active.length;$('doneCount').textContent=done.length;$('activeList').innerHTML=active.length?active.map(o=>card(o)).join(''):'<div class="empty">لا توجد طلبات حالية.</div>';$('doneList').innerHTML=done.length?done.map(o=>card(o)).join(''):'<div class="empty">لا توجد طلبات مكتملة بعد.</div>';const w=products.filter(p=>Number(p.stock||0)<=Number(p.min||0));$('warnings').innerHTML=w.length?w.map(p=>`<div class="warn"><b>${esc(p.name)}</b><br>المخزون: ${p.stock||0}</div>`).join(''):'✓ لا توجد تنبيهات.';$('pSup').innerHTML='<option value="">بدون مورد</option>'+suppliers.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');$('supplierList').innerHTML=suppliers.map(s=>`<div class="card"><b>${esc(s.name)}</b><br>${esc(s.phone||'—')}<br>${esc(s.address||'—')}</div>`).join('')||'لا يوجد موردون.';$('customerList').innerHTML=customers.map(c=>`<div class="card"><b>${esc(c.name)}</b><br>${esc(c.phone||'—')}<br>${esc(c.city||'—')}</div>`).join('')||'لا يوجد زبناء.';$('productList').innerHTML=products.map(p=>`<div class="card">${p.images?.[0]?`<img class="thumb" src="${esc(p.images[0])}">`:''}<br><b>${esc(p.name)}</b><br>سعر البيع: ${Number(p.price||0).toLocaleString()} MRU<br>المخزون: ${Number(p.stock||0)}</div>`).join('')||'لا توجد منتجات.'}
function profit(){const c=Number($('pCost').value||0),p=Number($('pPrice').value||0),r=p-c;$('pProfit').value=r.toLocaleString()+' MRU';$('pMargin').value=(p>0?r/p*100:0).toFixed(1)+'%'}$('pCost').oninput=profit;$('pPrice').oninput=profit;
$('pImages').onchange=()=>{const fs=[...$('pImages').files];if(fs.length>6){$('pImages').value='';return alert('الحد الأقصى 6 صور')}$('preview').innerHTML=fs.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('')};
async function upload(fs){const out=[];for(let i=0;i<fs.length;i++){$('uploadMsg').textContent=`رفع الصورة ${i+1} من ${fs.length}`;const fd=new FormData();fd.append('file',fs[i]);fd.append('upload_preset',PRESET);const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,{method:'POST',body:fd}),d=await r.json();if(!r.ok||!d.secure_url)throw Error('فشل رفع الصورة');out.push(d.secure_url)}return out}
$('saveProduct').onclick=async()=>{const name=$('pName').value.trim(),price=Number($('pPrice').value||0);if(!name||price<=0)return alert('أدخل الاسم وسعر البيع');const fs=[...$('pImages').files],cost=Number($('pCost').value||0),sid=$('pSup').value,s=suppliers.find(x=>x.id===sid),btn=$('saveProduct');btn.disabled=true;try{const images=await upload(fs),ref=doc(collection(db,'products')),b=writeBatch(db);b.set(ref,{name,category:$('pCat').value,meta:$('pMeta').value.trim(),price,stock:Number($('pStock').value||0),min:Number($('pMin').value||0),images,active:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});b.set(doc(db,'product_private',ref.id),{cost,supplierId:sid,supplierName:s?.name||'',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await b.commit();alert('تم حفظ المنتج');$('pName').value=$('pCost').value=$('pPrice').value=$('pMeta').value='';$('pImages').value='';$('preview').innerHTML='';$('uploadMsg').textContent='';profit()}catch(e){alert(e.message)}finally{btn.disabled=false}};
$('saveSupplier').onclick=async()=>{if(!$('sName').value.trim())return alert('أدخل اسم المورد');await addDoc(collection(db,'suppliers'),{name:$('sName').value.trim(),phone:$('sPhone').value.trim(),whats:$('sWhats').value.trim(),address:$('sAddress').value.trim(),materials:$('sMaterials').value.trim(),createdAt:serverTimestamp()});$('sName').value=$('sPhone').value=$('sWhats').value=$('sAddress').value=$('sMaterials').value=''};
$('saveCustomer').onclick=async()=>{if(!$('cName').value.trim())return alert('أدخل اسم الزبون');await addDoc(collection(db,'customers'),{name:$('cName').value.trim(),phone:$('cPhone').value.trim(),whats:$('cWhats').value.trim(),city:$('cCity').value.trim(),address:$('cAddress').value.trim(),createdAt:serverTimestamp()});$('cName').value=$('cPhone').value=$('cWhats').value=$('cCity').value=$('cAddress').value=''};
render();
</script></body></html>
