name: Delivery fee system

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-delivery-fees.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix patch syntax
        run: sed -i 's/o\.subtotal??o\.total||0/(o.subtotal ?? o.total ?? 0)/g' .github/scripts/add_delivery_fees.py
      - name: Patch store, admin and rules
        run: python .github/scripts/add_delivery_fees.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for src, out in [('index.html','/tmp/index.mjs'),('admin.html','/tmp/admin.mjs')]:
              text=Path(src).read_text(encoding='utf-8')
              blocks=re.findall(r'<script type="module">(.*?)</script>',text,re.S)
              if not blocks:
                  raise SystemExit('No module script in '+src)
              Path(out).write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/index.mjs
          node --check /tmp/admin.mjs
      - name: Commit upgrade
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "limamahmd16@gmail.com"
          git add index.html admin.html firestore.rules
          git rm -f .github/scripts/add_delivery_fees.py .github/workflows/add-delivery-fees.yml
          git commit -m "Add delivery fees by city and area"
          git push
