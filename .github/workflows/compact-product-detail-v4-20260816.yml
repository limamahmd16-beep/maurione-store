name: Compact product detail v4

on:
  push:
    paths:
      - '.github/workflows/compact-product-detail-v4-20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact product detail
        run: python scripts/compact-product-detail-v4-20260816.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify compact detail
        run: |
          grep -q 'MauriOne product detail v4' index.html
          grep -q 'flex:0 0 132px' index.html
          grep -q 'height:205px' index.html
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Make product detail and recommendations more compact"
            git push
          fi
