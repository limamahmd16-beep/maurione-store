name: Separate cancelled orders

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/separate-cancelled-orders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cancelled orders section
        run: python .github/scripts/separate_cancelled_orders.py
      - name: Check admin JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('admin.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script type="module">(.*?)</script>',text,re.S)
          if not blocks:
              raise SystemExit('No module script in admin.html')
          Path('/tmp/admin.mjs').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/admin.mjs
      - name: Commit fix
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "limamahmd16@gmail.com"
          git add admin.html
          git rm -f .github/scripts/separate_cancelled_orders.py .github/workflows/separate-cancelled-orders.yml
          git commit -m "Separate cancelled orders in admin"
          git push
