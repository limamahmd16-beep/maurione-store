name: Deploy MauriOne home icon v20
on:
  push:
    paths:
      - '.github/workflows/deploy-home-icon-v20-20260817.yml'
permissions:
  contents: write
jobs:
  deploy-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify MauriOne icon assets
        run: |
          test -f apple-touch-icon.png
          test -f favicon.png
          test -f maurione-icon-192.png
          test -f maurione-icon-512.png
          test -f site.webmanifest
      - name: Refresh icon cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for x in ['rel="apple-touch-icon"','rel="manifest"','apple-mobile-web-app-title']:
              if x not in s: raise SystemExit('missing '+x)
          s=s.replace('/apple-touch-icon.png?v=2','/apple-touch-icon.png?v=3')
          s=s.replace('/favicon.png?v=2','/favicon.png?v=3')
          s=s.replace('/site.webmanifest?v=2','/site.webmanifest?v=3')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate storefront JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/store.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/store.mjs
      - name: Commit icon metadata refresh
        run: |
          git config user.name 'MauriOne Bot'
          git config user.email 'limamahmd16@gmail.com'
          git add index.html
          git commit -m 'Publish MauriOne home screen icon'
          git push
