name: Fix MauriOne header mark v19

on:
  push:
    paths:
      - '.github/workflows/fix-header-mark-v19-20260817.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply header mark fix
        run: python3 scripts/fix-header-mark-v19-20260817.py
      - name: Validate storefront JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',html,re.S)
          if not m:
            raise SystemExit('module script not found')
          Path('/tmp/storefront.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/storefront.mjs
      - name: Verify header mark fix
        run: |
          grep -q 'MauriOne header mark v19' index.html
          grep -q 'width:18px!important' index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Resize header mark only'
          git push
