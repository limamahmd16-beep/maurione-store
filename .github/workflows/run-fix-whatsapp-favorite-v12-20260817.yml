name: Run WhatsApp and favorite fix v12

on:
  push:
    paths:
      - '.github/workflows/run-fix-whatsapp-favorite-v12-20260817.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/fix_whatsapp_favorite_v12.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify requested changes
        run: |
          grep -q 'MauriOne WhatsApp + inline favorite v12' index.html
          grep -q 'product-price-row' index.html
          grep -q 'class="whatsapp-mark"' index.html
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix WhatsApp icon and move favorite beside price"
          git push
