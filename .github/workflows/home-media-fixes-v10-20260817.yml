name: Home media fixes v10

on:
  push:
    paths:
      - '.github/workflows/home-media-fixes-v10-20260817.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix WhatsApp button and product card images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          marker = '/* MauriOne home media fixes v10 */'
          css = r'''
/* MauriOne home media fixes v10 */
.product-img{background:#fff!important}
.product-img img{
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  object-position:center center!important;
  display:block!important;
  padding:5px!important;
  background:#fff!important;
  image-rendering:auto;
}
.support-fab{
  left:16px!important;
  bottom:calc(100px + env(safe-area-inset-bottom))!important;
  width:54px!important;
  height:54px!important;
  border-radius:50%!important;
  background:#25D366!important;
  border:3px solid #fff!important;
  box-shadow:0 8px 24px rgba(0,0,0,.18)!important;
  overflow:hidden!important;
  align-items:center!important;
  justify-content:center!important;
}
.support-fab svg{
  width:29px!important;
  height:29px!important;
  fill:none!important;
  stroke:#fff!important;
  stroke-width:1.8!important;
  stroke-linecap:round!important;
  stroke-linejoin:round!important;
}
'''
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          wa_pattern = re.compile(r'<a id="whatsappSupport" class="support-fab"[^>]*>.*?</a>', re.S)
          wa_new = '''<a id="whatsappSupport" class="support-fab" href="#" target="_blank" rel="noopener" aria-label="دعم MauriOne عبر WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.8a8.5 8.5 0 0 1-12.6 7.5L3 20.6l1.3-4.7A8.5 8.5 0 1 1 20.5 11.8Z"/><path d="M8.2 8.3c.3-.7.8-.8 1.2-.8h.4c.2 0 .4.1.5.4l1 2.3c.1.3.1.6-.1.8l-.8.9c-.2.2-.2.5-.1.7.6 1.3 1.6 2.3 2.9 2.9.3.1.5.1.7-.1l.9-1c.2-.2.5-.3.8-.1l2.3 1.1c.3.1.4.3.4.6v.4c0 .5-.2 1-.8 1.3-.7.3-1.6.5-2.7.1-1.7-.5-3.5-1.6-5.1-3.2-1.6-1.6-2.6-3.4-3.1-5-.3-1-.1-1.9.3-2.5Z"/></svg></a>'''
          s2, n = wa_pattern.subn(wa_new, s, count=1)
          if n != 1:
              raise SystemExit('WhatsApp support anchor not found exactly once')
          s = s2

          if 'function productCardImage(url)' not in s:
              old = '''function productArt(p){const u=Array.isArray(p.images)&&p.images.length?p.images[0]:'';return u?`<img src="${esc(u)}" alt="${esc(p.name)}" loading="lazy">`:'<div class="mock"></div>'}'''
              new = '''function productCardImage(url){const u=String(url||'');if(!u)return '';if(u.includes('res.cloudinary.com')&&u.includes('/image/upload/')){const t='f_auto,q_auto:best,w_900,h_700,c_pad,b_white';if(u.includes('/image/upload/'+t+'/'))return u;return u.replace('/image/upload/','/image/upload/'+t+'/')}return u}\nfunction productArt(p){const u=Array.isArray(p.images)&&p.images.length?p.images[0]:'';const src=productCardImage(u);return src?`<img src="${esc(src)}" alt="${esc(p.name)}" loading="lazy" decoding="async">`:'<div class="mock"></div>'}'''
              if old not in s:
                  raise SystemExit('productArt anchor not found')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify focused fixes only
        run: |
          grep -q 'MauriOne home media fixes v10' index.html
          grep -q 'background:#25D366' index.html
          grep -q 'function productCardImage(url)' index.html
          grep -q 'w_900,h_700,c_pad,b_white' index.html
          test "$(grep -o 'id="whatsappSupport"' index.html | wc -l | tr -d ' ')" = "1"
      - name: Commit final storefront and remove temporary workflow
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/home-media-fixes-v10-20260817.yml
          git add index.html
          git commit -m "Fix WhatsApp button and product card images"
          git push
