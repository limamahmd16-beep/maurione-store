name: Home card tighten v11

on:
  push:
    paths:
      - '.github/workflows/home-card-tighten-v11-20260817.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested home card fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          marker = '/* MauriOne home card tighten v11 */'
          css = r'''
/* MauriOne home card tighten v11 */
#home .product-img{
  height:230px!important;
  background:#fff!important;
  padding:0!important;
}
#home .product-img img{
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  object-position:center!important;
  padding:0!important;
  background:#fff!important;
}
#home .product h3{
  min-height:0!important;
  margin-top:4px!important;
  margin-bottom:0!important;
  line-height:1.35!important;
}
#home .product h3 + small:empty{display:none!important}
#home .product small{margin-top:3px!important}
#home .product-rating{margin-top:3px!important}
#home .price{margin-top:4px!important}
#home .stock{margin-top:4px!important}
#home .add{margin-top:7px!important}
.support-fab svg{
  width:30px!important;
  height:30px!important;
  fill:none!important;
  stroke:#fff!important;
  stroke-width:2!important;
  stroke-linecap:round!important;
  stroke-linejoin:round!important;
}
'''
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          old_t = 'f_auto,q_auto:best,w_900,h_700,c_pad,b_white'
          new_t = 'f_auto,q_auto:best,w_1200,c_limit'
          if old_t in s:
              s = s.replace(old_t, new_t, 1)
          elif new_t not in s:
              raise SystemExit('product image transform anchor not found')

          wa_pattern = re.compile(r'<a id="whatsappSupport" class="support-fab"[^>]*>.*?</a>', re.S)
          wa_new = '''<a id="whatsappSupport" class="support-fab" href="#" target="_blank" rel="noopener" aria-label="دعم MauriOne عبر WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 11.7a8.3 8.3 0 0 1-12.4 7.2L3.3 20l1.2-4.4a8.3 8.3 0 1 1 15.8-3.9Z"/><path d="M8.4 7.4c.5 2.5 1.6 4.6 3.3 6.3 1.7 1.7 3.8 2.8 6.3 3.3l1.4-1.9-2.6-1.2-1.1 1.2a8.6 8.6 0 0 1-6.8-6.8l1.2-1.1-1.2-2.6L7 6c-.2.5-.2.9-.1 1.4"/></svg></a>'''
          s2, n = wa_pattern.subn(wa_new, s, count=1)
          if n != 1:
              raise SystemExit('WhatsApp support anchor not found exactly once')
          s = s2

          path.write_text(s, encoding='utf-8')
          PY
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify focused changes
        run: |
          grep -q 'MauriOne home card tighten v11' index.html
          grep -q 'height:230px' index.html
          grep -q 'w_1200,c_limit' index.html
          grep -q 'h3 + small:empty' index.html
          test "$(grep -o 'id="whatsappSupport"' index.html | wc -l | tr -d ' ')" = "1"
      - name: Commit storefront and remove temporary workflow
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/home-card-tighten-v11-20260817.yml
          git add index.html
          git commit -m "Tighten home product card and fix WhatsApp icon"
          git push
