name: Product sharing links

on:
  push:
    paths:
      - 'scripts/product-sharing-links.py'
      - '.github/workflows/product-sharing-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product sharing and deep links
        run: python scripts/product-sharing-links.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ['index.html','admin.html']:
              s=Path(name).read_text(encoding='utf-8')
              m=re.search(r'<script type="module">(.*)</script>',s,re.S)
              assert m, f'module script missing: {name}'
              Path('/tmp/'+name+'.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/index.html.mjs
          node --check /tmp/admin.html.mjs
      - name: Verify anchors
        run: |
          grep -q 'id="detailShare"' index.html
          grep -q 'function showProduct' index.html
          grep -q 'handleProductDeepLink' index.html
          grep -q 'window.shareProduct=async' index.html
          grep -q 'فتح المنتج' admin.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add shareable product links and deep linking'
            git push
          fi
