name: Checkout redesign v8

on:
  push:
    paths:
      - '.github/workflows/checkout-redesign-v8-20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checkout redesign
        run: python scripts/checkout-redesign-v8-20260816.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify checkout redesign
        run: |
          grep -q 'checkout-modal' index.html
          grep -q 'معلومات العميل' index.html
          grep -q 'ملخص الطلب' index.html
          grep -q 'checkout-confirm' index.html
          test "$(grep -o 'id="coName"' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="coPayment"' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="placeOrderBtn"' index.html | wc -l | tr -d ' ')" = "1"
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Redesign checkout experience"
            git push
          fi
