name: Cart redesign v9

on:
  push:
    paths:
      - '.github/workflows/cart-redesign-v9-20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cart redesign
        run: python scripts/cart-redesign-v9-20260816.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify cart redesign
        run: |
          grep -q 'cart-v3' index.html
          grep -q 'cart-item-v3' index.html
          grep -q 'cart-summary-v3' index.html
          grep -q 'setCartView' index.html
          test "$(grep -o 'id="cartList"' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="cartSummary"' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="myOrdersList"' index.html | wc -l | tr -d ' ')" = "1"
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Redesign cart and orders screen"
            git push
          fi
