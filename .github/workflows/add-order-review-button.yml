name: Add order review button
on:
  push:
    paths:
      - '.github/workflows/add-order-review-button.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply order review button patch
        run: python3 scripts/add-order-review-button.py
      - name: Validate storefront JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          pathlib.Path('/tmp/storefront.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/storefront.mjs
      - name: Verify review button anchors
        run: |
          grep -q 'openProductReview' index.html
          grep -q 'order-review-btn' index.html
          grep -q "renderOrderItems(o.items,o.status)" index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show review button on delivered orders" || exit 0
          git push
