name: Remove MauriOne demo products v20

on:
  push:
    paths:
      - '.github/workflows/remove-demo-products-v20-20260817.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove demo products
        run: python3 scripts/remove-demo-products-v20-20260817.py
      - name: Validate storefront JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',html,re.S)
          if not m:
            raise SystemExit('module script not found')
          Path('/tmp/storefront.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/storefront.mjs
      - name: Verify demo products removed
        run: |
          grep -Fq 'const demoProducts=[];' index.html
          ! grep -Fq 'iPhone 15 Pro Max' index.html
          ! grep -Fq 'Galaxy S24 Ultra' index.html
          ! grep -Fq 'AirPods Pro 2' index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove storefront demo products'
          git push
