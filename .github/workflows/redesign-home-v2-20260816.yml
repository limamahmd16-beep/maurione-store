name: Redesign MauriOne home v2

on:
  push:
    paths:
      - '.github/workflows/redesign-home-v2-20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply home redesign
        run: python scripts/redesign-home-v2-20260816.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify redesign
        run: |
          grep -q 'MauriOne home redesign v2' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.index('id="siteProductsSection"') < s.index('id="siteCategoriesSection"') < s.index('id="siteTrust"')
          PY
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Redesign MauriOne home for a cleaner premium layout"
            git push
          fi
