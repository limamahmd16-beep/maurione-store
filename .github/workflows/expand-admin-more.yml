name: Expand admin More
on:
  push:
    paths:
      - '.github/workflows/expand-admin-more.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch_more.py
      - run: rm .github/workflows/expand-admin-more.yml .github/scripts/patch_more.py
      - run: |
          git config user.name "MauriOne Bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html index.html .github/workflows/expand-admin-more.yml .github/scripts/patch_more.py
          git commit -m "Expand admin More controls and site content management"
          git push
