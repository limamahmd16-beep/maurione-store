name: Customer account upgrade
on:
  push:
    paths:
      - '.github/workflows/expand-admin-more.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer accounts
        run: python3 scripts/customer_account_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Firebase customer accounts and cloud orders"
          git push
