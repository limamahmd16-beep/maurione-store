name: Automatic inventory upgrade
on:
  push:
    paths:
      - '.github/workflows/expand-admin-more.yml'
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply inventory automation
        run: python3 scripts/inventory_automation.py
      - name: Verify storefront and admin JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for src,out in [('index.html','/tmp/store.mjs'),('admin.html','/tmp/admin.mjs')]:
              s=Path(src).read_text()
              marker='<script type="module">'
              a=s.index(marker)+len(marker)
              b=s.index('</script>',a)
              Path(out).write_text(s[a:b])
          PY
          node --check /tmp/store.mjs
          node --check /tmp/admin.mjs
      - name: Commit verified inventory upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git diff --cached --quiet || git commit -m "Add automatic inventory reservation and cancellation restore"
          git push
