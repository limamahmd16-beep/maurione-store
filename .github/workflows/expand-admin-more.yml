name: Product details upgrade
on:
  push:
    paths:
      - '.github/workflows/expand-admin-more.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch product details
        run: python3 scripts/product_detail_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html index.html
          git diff --cached --quiet || git commit -m "Add complete product detail pages"
          git push