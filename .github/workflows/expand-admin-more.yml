name: Storefront JavaScript line inspect
on:
  push:
    paths:
      - '.github/workflows/expand-admin-more.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print suspect lines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          marker='<script type="module">'
          a=s.index(marker)+len(marker)
          b=s.index('</script>',a)
          lines=s[a:b].splitlines()
          for i in range(48,55):
              if i <= len(lines): print(f'{i}: {lines[i-1]}')
          PY
