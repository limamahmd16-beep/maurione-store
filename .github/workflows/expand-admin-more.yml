name: Fix storefront JavaScript
on:
  push:
    paths:
      - '.github/workflows/expand-admin-more.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply syntax fix
        run: python3 scripts/fix_account_brace.py
      - name: Verify JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          marker='<script type="module">'
          a=s.index(marker)+len(marker)
          b=s.index('</script>',a)
          Path('/tmp/store.mjs').write_text(s[a:b])
          PY
          node --check /tmp/store.mjs
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix storefront JavaScript syntax"
          git push
