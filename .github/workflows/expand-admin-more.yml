name: Storefront JavaScript check
on:
  push:
    paths:
      - '.github/workflows/expand-admin-more.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract module script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          marker='<script type="module">'
          a=s.index(marker)+len(marker)
          b=s.index('</script>',a)
          Path('/tmp/store.mjs').write_text(s[a:b])
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/store.mjs
