name: Search filters update

on:
  push:
    paths:
      - '.github/workflows/search-filters-20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply search filters
        run: python scripts/search-filters-20260816.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>', start)
          Path('/tmp/storefront.mjs').write_text(s[start:end], encoding='utf-8')
          PY
          node --check /tmp/storefront.mjs
      - name: Verify filters
        run: |
          grep -q 'id="searchSort"' index.html
          grep -q 'id="searchStockOnly"' index.html
          grep -q "sort==='rating'" index.html
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add storefront product sorting and stock filters"
            git push
          fi
