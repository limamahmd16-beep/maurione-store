name: Polish MauriOne storefront

on:
  push:
    paths:
      - '.github/workflows/polish-storefront-20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply storefront polish
        run: python scripts/polish-storefront-20260816.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','admin.html']:
              s=Path(name).read_text(encoding='utf-8')
              start=s.index('<script type="module">')+len('<script type="module">') if '<script type="module">' in s else s.index('<script type=\"module\">')+len('<script type=\"module\">')
              end=s.index('</script>', start)
              Path('/tmp/'+name+'.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.html.mjs
          node --check /tmp/admin.html.mjs
      - name: Verify storefront polish
        run: |
          grep -q 'id="whatsappSupport"' index.html
          grep -q 'supportWhatsApp' index.html
          grep -q 'categoryIcons' index.html
          grep -q '>منتجاتنا<' index.html
          grep -q 'id="setSupportWhatsApp"' admin.html
          grep -q 'Français — قريبًا' admin.html
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html admin.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Polish storefront UX and support controls"
            git push
          fi
