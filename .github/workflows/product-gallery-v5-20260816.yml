name: Product gallery v5

on:
  push:
    paths:
      - '.github/workflows/product-gallery-v5-20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product gallery update
        run: python scripts/product-gallery-v5-20260816.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify product gallery
        run: |
          grep -q 'id="detailPrev"' index.html
          grep -q 'id="productImageViewer"' index.html
          grep -q 'openProductImage' index.html
          grep -q 'object-fit:contain!important' index.html
          grep -q 'displayProductImage' index.html
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Improve product image gallery and fullscreen viewer"
            git push
          fi
