name: Clean product actions v7

on:
  push:
    paths:
      - '.github/workflows/clean-product-actions-v7-20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product action cleanup
        run: python scripts/clean-product-actions-v7-20260816.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify product actions
        run: |
          grep -q 'detail-inline-add' index.html
          test "$(grep -o 'onclick="shareProduct()"' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="galleryFavorite"' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="detailFavorite"' index.html | wc -l | tr -d ' ')" = "0"
          test "$(grep -o 'id="detailAdd"' index.html | wc -l | tr -d ' ')" = "1"
          ! grep -q 'class="detail-buybar"' index.html
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Remove duplicate product actions and move add to cart"
            git push
          fi
