name: Amazon-style product gallery v6

on:
  push:
    paths:
      - '.github/workflows/amazon-gallery-v6-20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gallery patch
        run: python scripts/amazon-gallery-v6-20260816.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify Amazon-style gallery
        run: |
          grep -q 'amazon-gallery' index.html
          grep -q 'id="detailDots"' index.html
          grep -q 'galleryTouchX' index.html
          grep -q 'id="galleryFavorite"' index.html
          grep -q 'w_1600,c_limit' index.html
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Redesign product gallery with swipe and dots"
            git push
          fi
