name: Remove hero phone
on:
  push:
    paths:
      - '.github/scripts/remove_hero_phone.py'
      - '.github/workflows/remove-hero-phone.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/remove_hero_phone.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          Path('/tmp/store.mjs').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/store.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove decorative phone from hero" || exit 0
          git push
