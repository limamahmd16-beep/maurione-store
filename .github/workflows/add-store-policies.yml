name: Add store policies
on:
  push:
    paths:
      - '.github/workflows/add-store-policies.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply policy patch
        run: python .github/scripts/add-store-policies.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','admin.html']:
              s=Path(name).read_text(encoding='utf-8')
              start=s.index('<script type="module">')+len('<script type="module">')
              end=s.index('</script>',start)
              Path('/tmp/'+name+'.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.html.mjs
          node --check /tmp/admin.html.mjs
      - name: Verify policy UI
        run: |
          grep -q 'سياسات MauriOne' index.html
          grep -q "window.openPolicy" index.html
          grep -q 'ctReturnPolicy' admin.html
          grep -q 'ctPrivacyPolicy' admin.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html
          git rm -f .github/scripts/add-store-policies.py .github/workflows/add-store-policies.yml
          git commit -m 'Add editable store policies'
          git push
