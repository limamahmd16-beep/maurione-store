name: Content stock label cleanup
on:
  push:
    paths:
      - '.github/workflows/fix-content-stock-label.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_content_stock_label.py
      - name: Verify storefront JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text();m='<script type="module">';a=s.index(m)+len(m);b=s.index('</script>',a);Path('/tmp/store.mjs').write_text(s[a:b])
          PY
          node --check /tmp/store.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix configurable stock label"
          git push
