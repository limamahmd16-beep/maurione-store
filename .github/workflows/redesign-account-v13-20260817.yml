name: Redesign MauriOne account v13

on:
  push:
    paths:
      - '.github/workflows/redesign-account-v13-20260817.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply account redesign
        run: python scripts/redesign-account-v13-20260817.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify account redesign
        run: |
          grep -q 'MauriOne account redesign v13' index.html
          grep -q '#accountPage .account-user::before' index.html
          grep -q '#accountPage #accountSaveBtn' index.html
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign account page only"
          git push
