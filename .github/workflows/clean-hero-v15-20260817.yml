name: Clean MauriOne hero v15

on:
  push:
    paths:
      - '.github/workflows/clean-hero-v15-20260817.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove hero text and overlay
        run: python3 scripts/clean-hero-v15-20260817.py

      - name: Validate storefront JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit('module script not found')
          Path('/tmp/storefront.mjs').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/storefront.mjs

      - name: Verify hero cleanup
        run: |
          grep -q 'MauriOne clean hero v15' index.html
          grep -q '#siteHero .hero-copy' index.html
          if grep -q 'linear-gradient(rgba(2,3,4,.45),rgba(7,16,30,.55)),' index.html; then
            echo 'hero overlay still present'
            exit 1
          fi

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove homepage hero text and overlay'
          git push
