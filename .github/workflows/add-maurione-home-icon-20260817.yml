name: Add MauriOne home icon

on:
  push:
    paths:
      - '.github/workflows/add-maurione-home-icon-20260817.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MauriOne icons and metadata
        run: python3 scripts/add-maurione-home-icon-20260817.py
      - name: Verify icon files
        run: |
          test -s apple-touch-icon.png
          test -s maurione-icon-192.png
          test -s maurione-icon-512.png
          test -s favicon.png
          test -s site.webmanifest
          grep -q 'rel="apple-touch-icon"' index.html
          grep -q 'rel="manifest"' index.html
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name,size in [('apple-touch-icon.png',180),('maurione-icon-192.png',192),('maurione-icon-512.png',512),('favicon.png',512)]:
              b=Path(name).read_bytes()
              assert b[:8] == b'\x89PNG\r\n\x1a\n', name
              w,h=struct.unpack('>II', b[16:24])
              assert (w,h)==(size,size), (name,w,h)
          PY
      - name: Validate storefront JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/storefront.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/storefront.mjs
      - name: Commit icon update
        run: |
          git config user.name 'MauriOne Bot'
          git config user.email 'limamahmd16@gmail.com'
          git add index.html apple-touch-icon.png maurione-icon-192.png maurione-icon-512.png favicon.png site.webmanifest
          git commit -m 'Use MauriOne logo for saved site icon'
          git push
