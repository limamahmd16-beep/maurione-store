name: Real customer accounts admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-customers-admin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin customer accounts
        run: python .github/scripts/real_customers_admin.py
      - name: Check admin JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('admin.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script type="module">(.*?)</script>',text,re.S)
          if not blocks:
              raise SystemExit('No module script in admin.html')
          Path('/tmp/admin.mjs').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/admin.mjs
      - name: Commit upgrade
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "limamahmd16@gmail.com"
          git add admin.html
          git rm -f .github/scripts/real_customers_admin.py .github/workflows/real-customers-admin.yml
          git commit -m "Show real customer accounts in admin"
          git push
