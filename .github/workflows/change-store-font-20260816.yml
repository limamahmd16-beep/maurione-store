name: Change MauriOne typography

on:
  push:
    paths:
      - '.github/workflows/change-store-font-20260816.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography update
        run: python scripts/change-store-font-20260816.py
      - name: Validate storefront JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/index.mjs
      - name: Verify font update
        run: |
          grep -q 'IBM Plex Sans Arabic' index.html
          grep -q 'MauriOne typography' index.html
      - name: Commit changes
        run: |
          git config user.name "MauriOne Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Improve MauriOne Arabic typography"
            git push
          fi
