name: Add MauriOne buy now v16

on:
  push:
    paths:
      - '.github/workflows/add-buy-now-v16-20260817.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add buy now button
        run: python3 scripts/add-buy-now-v16-20260817.py

      - name: Validate storefront JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit('module script not found')
          Path('/tmp/storefront.mjs').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/storefront.mjs

      - name: Verify buy now
        run: |
          grep -q 'MauriOne buy now v16' index.html
          grep -q 'window.buyNow=id=>' index.html
          grep -q 'product-actions-row' index.html
          grep -q 'اشتري الآن' index.html

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add buy now action to product cards'
          git push
